<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVAKR | Future Tech Portfolio</title>
    <meta name="description" content="R&D Engineer and Open Source Enthusiast Portfolio">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="bg-canvas-container">
        <canvas id="bg-canvas"></canvas>
    </div>

    <div class="interface-overlay">
        <header id="main-header">
            <div class="logo">RVAKR<span class="cursor">_</span></div>
            <nav>
                <ul id="nav-list">
                    <!-- Dynamic Nav Items -->
                </ul>
            </nav>
            <div class="theme-toggle-container">
                <button id="theme-toggle" aria-label="Toggle Theme">
                    <i class="fas fa-sun"></i>
                </button>
            </div>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </header>

        <main id="app">
            <!-- Sections will be injected here via JS -->
            <section id="hero" class="section">
                <div class="hero-content">
                    <h1 class="glitch" data-text="LOADING...">LOADING...</h1>
                </div>
            </section>
        </main>

        <footer id="main-footer">
            <div class="footer-content">
                <p>&copy; <span id="year"></span> RVAKR. <span class="dim">Status: Online</span></p>
                <div id="social-links" class="social-links"></div>
            </div>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>

</html>
